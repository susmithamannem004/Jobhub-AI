# DEPRECATED: This Render configuration is kept for reference only.
# Use `vercel.json` (Vercel) or documented deployment pipelines instead.
services:
  - type: web
    name: jobhub-ai-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
