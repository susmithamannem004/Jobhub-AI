name: JobHub AI — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Validate
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build React Client (Production)
        working-directory: client
        run: npm run build

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Validate Express Server Syntax
        working-directory: server
        run: node --check index.js

  # ─────────────────────────────────────────
  # JOB 2: Deploy to Vercel (main branch only)
  # ─────────────────────────────────────────
  deploy-to-vercel:
    name: Deploy to Vercel
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Production)
        run: |
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --confirm \
            --org=${{ secrets.VERCEL_ORG_ID }} \
            --project=${{ secrets.VERCEL_PROJECT_ID }}
